name: Figma Sync

on:
    workflow_dispatch:
    schedule:
        # Every day at 01:30 KST (16:30 UTC)
        - cron: '30 16 * * *'

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install
              run: npm ci

            - name: Sync from Figma
              env:
                  FIGMA_KEY: ${{ secrets.FIGMA_KEY }}
                  FIGMA_FILE_KEY: NnTQQhMv1k7NeFKefDu2G3
                  # Pace Figma API requests to avoid 429s on GitHub-hosted runners
                  FIGMA_MIN_GAP_MS: 2500
                  FIGMA_RETRIES: 40
                  FIGMA_MAX_BACKOFF_MS: 300000
                  # Disable Styles sync for now (it can be very chatty); focus on @export + @tokens first
                  FIGMA_ENABLE_STYLES: 0
              run: npm run figma:sync

            - name: Create Pull Request
              uses: peter-evans/create-pull-request@v6
              with:
                  commit-message: 'chore(figma): sync tokens/page scaffolds'
                  title: 'chore(figma): sync design tokens + page scaffolds'
                  body: |
                      Automated sync from Figma.

                      - Updates public/styles/tokens.css
                      - Updates views/partials/generated/figma-sections.ejs
                      - Updates views/partials/generated/figma-pages/*.ejs
                      - Updates views/partials/generated/figma-pages/manifest.json

                      If this PR looks wrong, adjust Figma Variables / @export frames.
                  branch: chore/figma-sync
                  delete-branch: true

